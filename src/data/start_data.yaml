  - name: Макароны с сыром и беконом
    category: Основные блюда
    recipe: |
      1. Выложить бекон на противень, посыпать небольшим количеством сахара и запекать в духовке при 180 °C 15–20 минут, а после нарезать кубиком.

      2. Отварить макароны до готовности в подсоленной воде и откинуть на дуршлаг, чтобы стекла вода.

      3. Измельчить сухарики до средней крошки.

      4. Натереть сыр чеддер на крупной тёрке и подготовить плавленый сыр, нарезав его ломтиками.

      5. Соединить в сотейнике сливочное масло и муку, прогреть на среднем огне до однородной массы. Влить молоко, добавить паприку и соус табаско чипотле, уварить до консистенции соуса бешамель.

      6. Ввести чеддер и плавленый сыр в горячий соус и постоянно помешивать до полного растворения сыра.

      7. Смешать отваренные макароны с беконом и зелёным луком, залить сырным соусом, тщательно перемешать, посолить и поперчить по вкусу.

      8. Выложить макароны в тарелки, полить острым соусом, посыпать крошкой сухариков и дополнить ломтиками огурца и мелко нарезанным луком.
