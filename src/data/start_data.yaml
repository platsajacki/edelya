  - name: Творожно-кокосовые колечки
    category: Выпечка
    recipe: |
      1. Смешать творог, одно яйцо, дополнительный яичный белок, кокосовую стружку, рисовую муку и разрыхлитель до однородного теста.

      2. Скатать из теста шарики влажными руками, сделать отверстие в центре и сформовать колечки.

      3. Выложить колечки на лист пергамента, смазать яичным желтком и посыпать оставшейся кокосовой стружкой.

      4. Выпекать колечки при температуре 190–200 °C около 25 минут до золотистого цвета.
