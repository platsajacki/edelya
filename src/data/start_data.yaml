  - name: Куриный суп с шампиньонами и сыром
    category: Супы
    recipe: |
      1. Промыть куриное филе, нарезать кусочками и отварить до готовности на медленном огне в течение 30 минут.

      2. Натереть на крупной тёрке морковь.

      3. Очистить и мелко нашинковать лук репчатый.

      4. Обжарить лук с морковью на растительном масле до золотистого цвета.

      5. Очистить и нарезать кубиками картофель, добавить к курице, выложить нарезанные шампиньоны и зажарку в бульон.

      6. Посолить, поперчить и варить суп в течение 10 минут.

      7. Добавить плавленый сыр, тщательно перемешать и варить 10–15 минут.

