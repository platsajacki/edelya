  - name: Солянка
    category: Супы
    recipe: |
      1. Приготовить бульон из говядины, затем вынуть мясо и нарезать его небольшими кусочками.

      2. Нарезать лук репчатый мелким кубиком, солёный огурец — небольшими кусочками.

      3. Разогреть подсолнечное масло на сковороде, пассеровать лук до мягкости, добавить огурец, накрыть крышкой и тушить около 10 минут.

      4. Добавить к луку с огурцами томатную пасту, перемешать и тушить ещё 2–3 минуты.

      5. Нарезать колбасу соломкой, сосиски кружками.

      6. В кипящий бульон добавить смесь лука с огурцами и томатной пастой, колбасу, сосиски, кусочки говядины, маслины и лавровый лист.

      7. Посолить, приправить перцем чёрным молотым и варить на среднем огне около 10 минут, затем дать настояться под крышкой.

      8. При подаче разлить солянку по тарелкам, добавить кружок лимона, посыпать зеленью и подать со сметаной по желанию.
