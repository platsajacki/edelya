  - name: Рыба с овощами в фольге
    category: Основные блюда
    recipe: |
      1. Промыть цветную капусту и брокколи, разделить на небольшие соцветия. Лук репчатый и лук красный нарезать мелкими кубиками, чеснок нарезать слайсами.

      2. Нагреть сковороду, влить масло оливковое. Обжарить лук до прозрачности, выложить свежие овощи и готовить 5 минут.

      3. Добавить замороженные овощи, чеснок, смесь трав, соль и чёрный молотый перец. Потушить ещё 7 минут и снять с огня.

      4. Лист фольги накрыть пергаментом и вырезать прямоугольники с запасом 10 см. В центр каждого выложить филе белой рыбы.

      5. Присыпать рыбу овощами, добавить кусочек сливочного масла.

      6. Свернуть конверты из фольги с пергаментом, плотно закрепив узкие края.

      7. Запекать конверты в разогретой до 200 °C духовке 10–20 минут в зависимости от количества замороженных овощей.

      8. Подавать рыбу, присыпав зелёным луком, петрушкой и укропом.
