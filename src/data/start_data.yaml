  - name: Панкейки
    category: Завтраки
    recipe: |
      1. Отделить белки от желтков, добавить к желткам часть сахара и перемешать.

      2. Влить к желткам молоко и размешать до однородности.

      3. Смешать муку с разрыхлителем, просеять в яичную массу и замесить густое плотное тесто.

      4. Взбить белки с солью, постепенно добавляя немного сахара, до устойчивых пиков.

      5. Аккуратно ввести взбитые белки в тесто силиконовой лопаткой движениями сверху вниз до однородного цвета.

      6. Налить на сковороду немного растительного масла, удалить излишки салфеткой и хорошо разогреть на среднем огне.

      7. Выложить тесто по 2 столовые ложки на один панкейк, налить на дно сковороды немного воды, накрыть крышкой и жарить пару минут на слабом огне.

      8. Добавить на каждый панкейк ещё по столовой ложке теста, накрыть крышкой и жарить ещё около 2 минут.

      9. Аккуратно перевернуть панкейки с помощью двух лопаток, накрыть крышкой и довести до готовности.

      10. Подавать панкейки сразу после приготовления со сливочным маслом, ягодами, мёдом или сахарной пудрой.
