  - name: Куриные рулетики в сливочно-пряном соусе
    category: Основные блюда
    recipe: |
      1. Нарезать шампиньоны, болгарский перец и лук.

      2. Промыть куриное филе, обсушить и разрезать вдоль на 2–3 тонких пласта из каждого куска.

      3. Отбить каждое филе обратной стороной ножа и посолить с двух сторон.

      4. На пару слайсов бекона выложить сверху веточку розмарина и пласт куриного филе.

      5. Распределить творожный сыр по филе и свернуть рулетики, при необходимости скрепить зубочисткой.

      6. Разогреть оливковое масло, слегка обжарить нарезанные овощи и аккуратно выложить к ним рулетики.

      7. Обжарить рулетики с двух сторон.

      8. Влить сливки, уварить на низком огне до готовности куриного филе, при желании накрыть крышкой или довести до готовности в духовке.
