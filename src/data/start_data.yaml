  - name: Бефстроганов с пюре
    category: Основные блюда
    recipe: |
      1. Нарезать говядину полосками поперёк волокон, сильно разогреть сковороду, влить подсолнечное масло и обжарить мясо до золотистого цвета, затем убрать со сковороды.

      2. Нарезать лук средними кубиками, добавить в сковороду сливочное масло и лук, обжарить до золотистости.

      3. Нарезать шампиньоны слайсами, добавить к луку и жарить 6–7 минут.

      4. Мелко нарезать чеснок, добавить в сковороду и перемешать.

      5. Убавить огонь, добавить муку, соль, кориандр свежемолотый, чеснок гранулированный и перец свежемолотый, хорошо перемешать, прогреть около минуты и влить сливки, затем перемешать и уварить соус до небольшого загустения.

      6. Вернуть обжаренную говядину в сковороду и тушить на медленном огне ещё пару минут.

      7. Выключить огонь и добавить мелко нарезанную петрушку, подать бефстроганов с нежным пюре из картофеля.
