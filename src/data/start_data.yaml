  - name: Сливочный грибной суп
    category: Супы
    recipe: |
      1. Нарезать лук мелко, шампиньоны тонкими ломтиками, картофель кубиком.

      2. Растопить в кастрюле сливочное масло, добавить оливковое масло, выложить лук и шампиньоны и обжарить на среднем огне, добавить тимьян.

      3. Влить белое сухое вино, перемешать и выпарить около 5 минут.

      4. Добавить муку, тщательно перемешать и влить горячий бульон или воду.

      5. Варить суп под крышкой 10–15 минут.

      6. Влить сливки, посолить, поперчить и продолжать варить на слабом огне.

      7. Добавить картофель и варить до его полной готовности.

      8. Нарезать белый хлеб кубиками и обжарить на оливковом масле до румяной корочки, посолить.

      9. Подать суп, при необходимости досолить и поперчить, сверху выложить сухарики из белого хлеба.
