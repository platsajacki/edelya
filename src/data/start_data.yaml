  - name: Шарлотка с карамелизированными яблоками
    category: Выпечка
    recipe: |
      1. Подготовить яблоки: промыть, очистить от кожуры и нарезать дольками.

      2. Карамелизировать яблоки: в сотейнике разогреть сливочное масло, добавить тростниковый сахар, выложить яблоки, всыпать ещё немного сахара и корицу, перемешать и уварить на огне до загустения сиропа.

      3. Взбить яйца с сахаром до густой светлой пены.

      4. Просеять муку с разрыхлителем и вмешать в яичную массу миксером на низких оборотах до однородного теста.

      5. Застелить форму бумагой для выпечки.

      6. Вылить тесто в форму, сверху выложить карамелизированные яблоки и равномерно распределить по поверхности.

      7. Выпекать шарлотку в духовке при температуре около 170 °C примерно 35 минут на среднем уровне в режиме верх-низ, при необходимости уменьшить температуру.
