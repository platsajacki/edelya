  - name: Хрустящий салат с курицей
    category: Салаты
    recipe: |
      1. Нарезать куриное филе вдоль на 2–3 части, замариновать в соли, перце и майонезе. 

      2. Обвалять курицу в муке, затем во взбитых яйцах и панировочных сухарях, при желании повторить слой яйца и сухарей для более хрустящей корочки. 

      3. Достать кукурузу из банки и обсушить бумажными полотенцами, выложить кукурузу и курицу на противень. 

      4. Запекать курицу и кукурузу при 190 °C: курицу около 20 минут, кукурузу 20–25 минут, периодически перемешивая кукурузу каждые 4–5 минут до хрустящего состояния. 

      5. Нарезать листья салата, черри, огурец, замаринованный лук и при желании зелёный лук, выложить в салатник. 

      6. Нарезать запечённую курицу, добавить к овощам вместе с запечённой кукурузой. 

      7. Смешать йогурт, соевый соус, лимонный сок, сухие травы, выдавленный чеснок и мёд до однородного соуса. 

      8. Полить салат приготовленным соусом и аккуратно перемешать или подать соус отдельно.
