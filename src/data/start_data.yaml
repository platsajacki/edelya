  - name: Яблочный штрудель
    category: Выпечка
    recipe: |
      1. Разогреть духовку до 220 °C.

      2. Просеять муку, сделать углубление, влить 1 ст. л. растительного масла и тёплую воду, добавить яйцо, щепотку соли и замесить тесто.

      3. Разделить тесто на две части, в одну часть добавить 1 ст. л. растительного масла, соединить со второй частью и вымесить.

      4. Скатать тесто в шар, полить оставшимся растительным маслом, накрыть и оставить на 30 минут.

      5. Выжать сок из половины лимона, удалить из яблок семечки и сердцевину, нарезать тонкими дольками и сбрызнуть лимонным соком.

      6. Измельчить миндаль ножом или в блендере, изюм обдать кипятком и обсушить.

      7. Присыпать полотенце мукой и раскатать на нём тесто как можно тоньше.

      8. Смазать тесто мягким сливочным маслом, присыпать панировочными сухарями или измельчённым печеньем, оставив с одного края неприсыпанную полосу шириной около 10 см.

      9. Выложить на сухари яблоки, изюм и миндаль, присыпать сахаром с корицей и разложить сверху несколько кусочков сливочного масла.

      10. Отделить желток от белка, желток взбить с молоком вилкой и смазать полоску теста без начинки.

      11. Свернуть штрудель рулетом с помощью полотенца.

      12. Смазать противень растительным маслом, присыпать мукой и выложить штрудель швом вниз.

      13. Смазать штрудель желтком с молоком и выпекать 40 минут, во время выпекания ещё 2–3 раза смазать молочно-яичной смесью.
