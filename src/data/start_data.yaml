  - name: Сливочная гречка с грибами и куриными бедрышками
    category: Основные блюда
    recipe: |
      1. Нарезать курицу кусочками, натереть солью, чёрным перцем и молотой паприкой.

      2. Обжарить куриное филе на сковороде в топлёном масле до золотистого цвета.

      3. Нарезать лук и шампиньоны, измельчить чеснок.

      4. Добавить лук, чеснок и грибы к курице, обжарить до мягкости овощей.

      5. Влить соевый соус и перемешать содержимое сковороды.

      6. Всыпать промытую гречку, залить горячей водой и посолить по вкусу.

      7. Готовить под крышкой на небольшом огне около 15 минут, при необходимости добавить немного воды.

      8. Влить сливки, прогреть 1–2 минуты и снять сковороду с огня.
