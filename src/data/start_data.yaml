  - name: Лисички в сметане
    category: Основные блюда
    recipe: |
      1. Нарезать лисички. Разогреть сливочное масло и пожарить на нём нарезанный лук до золотистого оттенка.

      2. Добавить грибы, посолить, накрыть крышкой и тушить 20–25 минут.

      3. Когда выпарится вода, добавить сметану и тушить на слабом огне ещё 10–12 минут.
