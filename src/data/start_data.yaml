  - name: Сметанник
    category: Выпечка
    recipe: |
      1. Растопить сливочное масло. Взбить яйца с 1 стаканом сахара и сливочным маслом до светлой пышной массы.

      2. Добавить 200 г сметаны, разрыхлитель, ванилин и муку, замесить однородное тесто.

      3. При желании разделить тесто на две части и в одну из них добавить какао.

      4. Вылить тесто в смазанную маслом форму и выпекать 20–30 минут при температуре 160 °C до готовности коржей.

      5. Для крема взбить 400 г сметаны с 1 столовой ложкой сахара до растворения сахара.

      6. Дать коржам остыть, разрезать их на пласты и хорошо обмазать кремом.

      7. Выложить коржи друг на друга и дать торту пропитаться 3–5 часов.

      8. Перед подачей украсить торт ягодами, орехами или тёртым шоколадом по вкусу.
