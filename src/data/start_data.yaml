  - name: Минестроне
    category: Супы
    recipe: |
      1. Нарезать морковь, лук, сельдерей маленьким кубиком, шпинат и зелень мелко.

      2. Разогреть кастрюлю с небольшим количеством масла, обжарить фарш до румяной корочки, разбивая на маленькие кусочки, затем убрать из кастрюли.

      3. В той же кастрюле обжарить лук, сельдерей, морковь, томатную пасту и итальянские травы около 5 минут.

      4. Добавить в кастрюлю фарш, томаты, бульон или горячую воду, соль, сахар, фасоль и пасту, довести до кипения.

      5. Варить суп на маленьком огне под приоткрытой крышкой до готовности пасты.

      6. Добавить шпинат и зелень, варить под крышкой ещё около 5 минут и перед подачей посыпать пармезаном.
