dishes:
  - name: Борщ с говядиной
    category: Супы
    recipe: |
      1. Вымыть говядину, залить водой, довести до кипения, снять пену и варить бульон на тихом огне около 40 минут. Очистить картофель, нарезать кубиком около 1,5 см.

      2. Когда бульон начнёт закипать, добавить перец чёрный горошком и лавровый лист, затем выложить картофель. Достать мясо из бульона, отделить от костей, нарезать небольшими кусочками и вернуть в кастрюлю. Довести до кипения, убавить огонь, снять пену и варить до мягкости картофеля 15–20 минут, лавровый лист через 10 минут вынуть.

      3. Морковь и свёклу вымыть, очистить и натереть на крупной тёрке, лук очистить и нарезать мелким кубиком.

      4. На разогретом растительном масле обжарить лук до прозрачности и лёгкой золотистости. Добавить тёртую морковь и измельчённый чеснок, обжарить 3–4 минуты до мягкости, посолить и поперчить по вкусу, затем переложить зажарку в кастрюлю с бульоном.

      5. Выложить на разогретую сковороду тёртую свёклу, влить красный винный уксус и тушить 5–7 минут до мягкости. Нашинковать капусту, посолить и поперчить свёклу, добавить томатную пасту, прогреть 1–2 минуты, переложить свекольную заправку и капусту в кастрюлю, всыпать сахар и при необходимости соль, затем томить борщ на минимальном огне под крышкой 1 час, периодически помешивая.

      6. Снять борщ с огня и дать настояться под крышкой 10–15 минут. Разлить по тарелкам, в каждую порцию добавить сметану и украсить укропом, подать горячим.
    ingredients:
      - name: Картофель
        amount: 400
        position: 2
      - name: Говядина
        amount: 400
        position: 3
      - name: Морковь
        amount: 250
        position: 4
      - name: Лук репчатый
        amount: 150
        position: 5
      - name: Лавровый лист
        amount: 3
        position: 6
      - name: Перец черный горошком
        amount: 5
        position: 7
      - name: Масло растительное
        amount: 20
        position: 8
      - name: Чеснок
        amount: 1
        position: 9
      - name: Свекла
        amount: 250
        position: 10
      - name: Томатная паста
