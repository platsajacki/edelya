  - name: Куриный суп с сырными рулетиками
    category: Супы
    recipe: |
      1. Нарезать курицу на кусочки и залить кипящей водой, довести до кипения и варить.

      2. Нарезать картофель кубиками и добавить к курице, варить бульон 20–30 минут до готовности картофеля и мяса.

      3. Соединить яйцо с солью и взбить венчиком, добавить муку и замесить тесто до однородной консистенции.

      4. Присыпать стол мукой, раскатать тесто в тонкий пласт, смазать плавленным сыром, свернуть в рулет и нарезать кусочками примерно по 1 см.

      5. Добавить сырные рулетики в кастрюлю с супом и варить около 5–8 минут до готовности.

      6. Нарезать лук и морковь, обжарить на растительном масле до мягкости и слегка золотистого цвета.

      7. Добавить зажарку в суп, посолить по вкусу, при подаче посыпать измельчённой зеленью.
