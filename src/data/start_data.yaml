  - name: Суп харчо
    category: Супы
    recipe: |
      1. Промыть говяжью грудинку, залить холодной водой в кастрюле объёмом 3,5 л и варить около 2 часов до готовности.

      2. Достать мясо, нарезать на небольшие кусочки и вернуть в бульон.

      3. Очистить и мелко нарезать лук репчатый, обжарить на растительном масле до мягкости, добавить томатную пасту и немного прогреть, помешивая.

      4. Переложить зажарку в бульон, добавить ткемали, сацебели или измельчённые в блендере помидоры с чесноком.

      5. Всыпать уцхо-сунели или хмели-сунели, кориандр, аджику и рис, варить около 10 минут до готовности риса.

      6. Мелко нарезать укроп и кинзу, добавить в суп, довести до вкуса и снять с огня.
