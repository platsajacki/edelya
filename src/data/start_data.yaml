  - name: Салат Оливье с колбасой
    category: Салаты
    recipe: |
      1. Вымыть картофель и морковь, не очищая, залить холодной водой и отварить 30 минут до готовности, затем полностью остудить.

      2. Вымыть яйца, залить холодной водой, довести до кипения и варить 8–10 минут, после чего остудить в холодной воде.

      3. Очистить остывшие картофель, морковь и яйца, нарезать их, колбасу и свежие огурцы маленькими кубиками одинакового размера.

      4. Достать маринованные огурцы из рассола, обсушить, при необходимости слить жидкость из полостей, разрезав вдоль, затем нарезать кубиками.

      5. Слить жидкость с зелёного горошка, соединить все ингредиенты в миске, добавить мелко нарезанные укроп и зеленый лук, заправить майонезом, посолить и поперчить по вкусу.
    ingredients:
      - name: Картофель
        amount: 400
        position: 1
      - name: Морковь
        amount: 150
        position: 2
      - name: Яйцо куриное
        amount: 4
        position: 3
      - name: Колбаса вареная
        amount: 300
        position: 4
      - name: Огурец маринованный
        amount: 130
        position: 5
      - name: Огурец
        amount: 130
        position: 5
      - name: Горошек зелёный консервированный
        amount: 200
        position: 6
      - name: Майонез
        amount: 120
        position: 7
      - name: Укроп
        amount: 1
        position: 8
        is_optional: true
      - name: Лук зелёный
        amount: 20
        position: 9
        is_optional: true
      - name: Перец черный молотый
        amount: 1
        position: 10
      - name: Соль
        amount: 1
        position: 11

  - name: Салат с творогом и овощами
    category: Салаты
    recipe: |
      1. Нарезать помидоры, красный лук и петрушку произвольно.

      2. Слить лишние сливки с творога, чтобы масса не была слишком жидкой.

      3. Смешать в одной тарелке творог, нарезанные помидоры, лук и петрушку.

      4. Добавить соус песто и соль по вкусу, тщательно перемешать.
    ingredients:
      - name: Творог зерненный в сливках
        amount: 300
        position: 1
      - name: Помидор
        amount: 300
        position: 2
      - name: Лук красный
        amount: 50
        position: 3
      - name: Петрушка
        amount: 1
        position: 4
      - name: Соус песто
        amount: 1
        position: 5
      - name: Соль
        amount: 1
        position: 6

  - name: Салат с курицей и фасолью
    category: Салаты
    recipe: |
      1. Отварить куриное филе и яйцо, остудить.

      2. Нарезать лук, залить уксусом и кипятком, мариновать 5 минут, затем слить жидкость.

      3. Нарезать отварное куриное филе, фасоль, маринованные огурцы и яйцо.

      4. Смешать сметану и горчицу до однородного соуса.

      5. Соединить в миске все нарезанные ингредиенты, добавить маринованный лук и заправить соусом.

      6. Посыпать салат рубленым укропом или другой зеленью перед подачей.
    ingredients:
      - name: Куриное филе
        amount: 160
        position: 1
      - name: Фасоль
