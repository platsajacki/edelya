      2. Нарезать лук и шампиньоны, обжарить лук до мягкости и переложить, затем на той же сковороде обжарить шампиньоны без добавления масла.

      3. Смешать грибы с луком, добавить творожный сыр и молоко, посолить и уварить соус пару минут, регулируя густоту количеством молока.

