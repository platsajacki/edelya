  - name: Творожные сырки в шоколадной глазури
    category: Десерты
    recipe: |
      1. Растопить шоколад на водяной бане, добавить растительное масло и перемешать до однородности.

      2. Смазать силиконовые формы шоколадной глазурью, накрыть плёнкой, поставить на доску и убрать в холодильник на 20 минут до застывания.

      3. Взбить блендером творог, сгущёнку и сливочное масло до однородной массы.

      4. Выложить часть творожной массы в формы, посередине сделать углубление, выложить консервированные ягоды и накрыть оставшейся творожной массой.

      5. Полить сырки сверху шоколадной глазурью, выровнять поверхность и поставить в морозилку на 4–5 часов до полного застывания.

      6. Переставить сырки из морозилки в холодильник на пару часов, затем извлечь из форм и подать к столу.
