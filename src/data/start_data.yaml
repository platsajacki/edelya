  - name: Рассольник классический
    category: Супы
    recipe: |
      1. Вымыть говядину, залить водой, довести до кипения, снять пену и варить бульон на тихом огне около 40 минут.

      2. Промыть перловку, выложить в кипящий бульон, убавить огонь до среднего и варить ещё около 30 минут.

      3. Очистить лук, морковь и картофель, вымыть и нарезать лук и морковь мелкими кубиками.

      4. Нарезать солёные огурцы небольшими кубиками.

      5. Разогреть растительное масло на сковороде, обжарить лук и морковь до золотистого оттенка, затем добавить огурцы и томатную пасту и перемешать.

      6. Влить в сковороду огуречный рассол, накрыть крышкой и тушить овощи до мягкости.

      7. Достать мясо из бульона, отделить от костей, нарезать небольшими кусочками и вернуть в кастрюлю с бульоном и перловкой.

      8. Нарезать картофель кубиками, выложить в бульон с мясом и перловкой и варить около 10 минут.

      9. Добавить в суп тушёные на сковороде овощи, варить ещё около 5 минут.

      10. Вложить лавровый лист, посолить, приправить чёрным перцем и карри по вкусу, выключить огонь и настоять суп не менее 10 минут.

      11. Подать рассольник со свежей зеленью и сметаной.
