  - name: Лосось с запечёнными овощами
    category: Основные блюда
    recipe: |
      1. Разогреть духовку до 200 °C, подготовить брокколи, цукини, болгарский перец и красный лук.

      2. Смешать овощи в большой миске.

      3. Добавить к овощам 1–2 столовые ложки масла оливкового, рубленый чеснок, сушёный тимьян, соль и перец чёрный молотый, тщательно перемешать.

      4. Выложить овощи ровным слоем на противень с пергаментной бумагой и запекать 10–12 минут.

      5. Промыть филе лосося под холодной водой и обсушить бумажными полотенцами.

      6. Смешать оставшееся масло оливковое, сок половины лимона, соль и перец чёрный молотый для заправки лосося.

      7. Достать противень с овощами, сдвинуть овощи к краям, выложить куски лосося в центр и смазать приготовленной заправкой.

      8. Запекать лосося с овощами ещё 10–12 минут до готовности рыбы.

      9. Переложить лосося и овощи на тарелки, украсить дольками лимона и свежей зеленью, подать сразу.
