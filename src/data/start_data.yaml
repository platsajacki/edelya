  - name: Жареный рис с овощами и курицей
    category: Основные блюда
    recipe: |
      1. Залить рис водой в пропорции 1:2 и отварить на среднем огне.

      2. Нарезать кубиком репчатый лук, болгарский перец, морковь и чеснок, а куриное филе - небольшими кусочками.

      4. Разогреть сливочное и растительное масло на сковороде, обжарить чеснок и лук, затем добавить морковь и болгарский перец и обжаривать, помешивая.

      5. Убрать овощи со сковороды, на этой же сковороде обжарить куриное филе до готовности, при необходимости добавить немного масла.

      6. Вернуть овощи в сковороду к курице, перемешать и добавить отваренный рис.

      7. Обжаривать рис с овощами и курицей около 2 минут, постоянно помешивая.

      8. Влить соевый соус и кунжутное масло, перемешать рис.

      9. Посыпать блюдо мелко нарезанным зелёным луком и семенами кунжута перед подачей.
