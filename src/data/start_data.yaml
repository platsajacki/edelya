  - name: Курица с чечевицей и овощами
    category: Основные блюда
    recipe: |
      1. Промыть чечевицу, замочить в воде на 1–2 часа, затем слить воду и ещё раз промыть.

      2. Нарезать куриные бёдра небольшим кубиком, добавить соль, паприку, орегано, базилик и обжарить на хорошо разогретой сковороде с небольшим количеством масла до образования корочки, затем переложить на тарелку.

      3. Нарезать лук и сладкий перец небольшим кубиком и обжарить на этой же сковороде около 3 минут до мягкости.

      4. Добавить к овощам чечевицу и курицу, влить горячую воду, довести до кипения, убавить огонь до минимального и тушить 15–20 минут, по мере необходимости подливая воду небольшими порциями.

      5. Когда чечевица станет мягкой, добавить протёртые томаты, сахар, соль, перец, паприку, орегано, базилик и хмели-сунели и тушить ещё 3–5 минут до готовности.

      6. Снять блюдо с огня, дать настояться 5–10 минут, посыпать мелко нарезанной петрушкой и тёртым пармезаном.
