  - name: Суп с фрикадельками и шпинатом
    category: Супы
    recipe: |
      1. Смешать фарш, кинзу и специи для фарша, сформировать маленькие фрикадельки.

      2. Обжарить фрикадельки на сковороде до полуготовности.

      3. Нарезать лук и морковь, измельчить чеснок.

      4. Обжарить лук и морковь в кастрюле до мягкости, добавить чеснок и прогреть.

      5. Влить воду, добавить бульонный кубик или готовый бульон, довести до кипения.

      6. Выложить фрикадельки в бульон и варить до их готовности и мягкости овощей.

      7. Добавить творожный сыр, размешать до однородности.

      8. Всыпать макаронные изделия и варить до готовности по времени на упаковке.

      9. Добавить шпинат, варить ещё около минуты, приправить солью и чёрным перцем по вкусу.
