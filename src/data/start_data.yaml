    category: Основные блюда
    recipe: |
      1. Смешать фарш из индейки или курицы, яйцо, мелко нарезанный лук и чеснок, соль и ароматные травы, тщательно перемешать вилкой.

      2. Сформировать влажными руками фрикадельки.

      3. Разогреть на сковороде растительное масло и обжарить фрикадельки со всех сторон до румяной корочки на среднем огне.

      4. Добавить протёртые томаты и сметану, влить воду и аккуратно перемешать соус до однородности.

      5. Томить фрикадельки под крышкой до готовности около 10 минут, затем добавить тёртый сыр и мелко нарезанную зелень, накрыть крышкой ещё на пару минут.

      6. Подать фрикадельки в томатном соусе горячими, при желании дополнить гарниром.
