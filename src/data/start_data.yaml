  - name: Картофель в медово-соевом соусе с кунжутом
    category: Основные блюда
    recipe: |
      1. Подготовить картофель: мелкий тщательно промыть и просушить, крупный вымыть, очистить и отварить 15–20 минут до полуготовности.

      2. Разогреть растительное масло на сковороде и выложить картофель в один слой, крупные клубни разрезать пополам.

      3. Обжарить картофель под крышкой 15–20 минут, помешивая каждые 5 минут, до мягкости внутри и румяной корочки снаружи.

      4. Смешать в миске мёд, соевый соус, измельчённый чеснок, кунжут и соль до однородности.

      5. Полить картофель подготовленным соусом и готовить ещё 2–3 минуты, помешивая, пока соус не загустеет, а картофель не покроется блестящей глазурью.
