  - name: Рубленные куриные котлеты
    category: Основные блюда
    recipe: |
      1. Нарезать куриное филе мелкими кубиками, натереть сыр, нарезать помидоры черри и мелко порубить зелень.

      2. Смешать куриное филе, яйцо, помидоры черри, зелень, сметану, муку и тертый сыр до однородной массы.

      3. Разогреть сковороду с небольшим количеством масла, выкладывать массу ложкой и обжаривать котлеты на среднем огне под крышкой до готовности с двух сторон.

      4. При необходимости добавить ещё немного муки в фарш, чтобы котлеты держали форму, не допуская излишней плотности.
