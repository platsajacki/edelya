  - name: Паста с лососем и шпинатом
    category: Основные блюда
    recipe: |
      1. Ополоснуть красную рыбу водой, просушить и нарезать небольшими кусочками.

      2. Раздавить чеснок в прессе или натереть на тёрке, слегка обжарить на оливковом масле, добавить рыбу и томить 5 минут до румяной корочки.

      3. Добавить шпинат и готовить пару минут, влить сливки, посыпать тёртым пармезаном, посолить и поперчить по вкусу, тушить 5 минут.

      4. Отварить спагетти до состояния аль денте по инструкции на упаковке, слить воду, выложить пасту в сковороду с соусом и перемешать.

      5. Готовить ещё 2 минуты, при желании добавить томаты и подать пасту к столу.
