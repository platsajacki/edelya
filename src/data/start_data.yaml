  - name: Паста лингвини с креветками и шпинатным соусом
    category: Основные блюда
    recipe: |
      1. Замариновать креветки в оливковом масле с солью, паприкой и измельчённым чесноком, затем обжарить на сковороде до готовности.

      2. Отварить пасту лингвини в подсоленной воде до состояния аль денте согласно инструкции на упаковке, затем откинуть на дуршлаг.

      3. Обжарить мелко нарезанные лук и чеснок на оливковом масле до мягкости.

      4. Измельчить в блендере шпинат, обжаренные лук и чеснок, творожный сыр, твёрдый сыр, соль и перец, залив сливками, до однородного соуса.

      5. Перелить соус в сковороду и слегка подогреть, постоянно помешивая в течение 3–4 минут.

      6. Смешать нужное количество пасты с горячим соусом, разложить по тарелкам, выложить сверху креветки и посыпать тёртым сыром.
