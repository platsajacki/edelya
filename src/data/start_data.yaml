  - name: Жаркое
    category: Основные блюда
    recipe: |
      1. Очистить картофель и морковь, промыть помидоры черри, нарезать кубиками и высыпать в глубокую миску, добавить нарезанный лук.

      2. Промыть говядину или свинину, срезать жилы и плёнки, нарезать на кусочки и добавить к овощам.

      3. Посолить, поперчить, добавить приправу для мяса и подсолнечное масло, затем тщательно перемешать.

      4. Выложить мясо с овощами в горшочки или жаропрочную форму и добавить немного воды.

      5. Поместить в духовку, разогретую до 200 °C, прикрыть горшочки крышками или форму фольгой и запекать до мягкости мяса, ориентируясь на размер нарезки.
