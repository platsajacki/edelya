  - name: Фаршированный батат с сыром и беконом
    category: Основные блюда
    recipe: |
      1. Разогреть духовку до 200 °C, застелить противень пергаментом, вымытый и высушенный батат проколоть вилкой и выложить на противень, запечь до мягкости 40–50 минут.

      2. Дать батату немного остыть, разрезать вдоль пополам и уменьшить температуру духовки до 190 °C.

      3. Ложкой вынуть мякоть, оставив тонкий слой на кожуре, мякоть выложить в миску, а шкурки положить на противень.

      4. Сбрызнуть шкурки оливковым маслом и запекать 10 минут.

      5. Размять мякоть батата со сливками или молоком, добавить соль и перец и тщательно перемешать.

      6. Наполнить шкурки пюре из батата и посыпать сверху тёртым сыром.

      7. Запекать лодочки 15 минут до расплавления сыра.

      8. Обжарить бекон до золотистой корочки и посыпать им готовые лодочки.

      9. Подавать батат с сметаной и нарезанным зелёным луком.
