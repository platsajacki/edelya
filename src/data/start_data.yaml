  - name: Салат с курицей, шампиньонами и перцем
    category: Салаты
    recipe: |
      1. Нарезать куриное филе тонкими слайсами, добавить соус унаги и запекать в аэрогриле 15 минут при температуре 160 °C.

      2. Нарезать перец сладкий и шампиньоны крупно, слегка посолить и запекать в аэрогриле 15 минут при температуре 170 °C.

      3. Нарезать помидор и подготовить салатные листья или зелень.

      4. Смешать растительное масло, соевый соус, лимонный сок, мёд и горчицу до однородной заправки.

      5. Смешать запечённое куриное филе, овощи и зелень, полить заправкой и подать к столу.
