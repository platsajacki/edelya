  - name: Банановый хлеб
    category: Выпечка
    recipe: |
      1. Размять вилкой в пюре два спелых банана.

      2. Добавить яйца и сахар, перемешать до однородной массы, при желании добавить корицу.

      3. Влить растительное масло, перемешать венчиком, просеять муку с солью и разрыхлителем и замесить вязкое тесто.

      4. Обжарить орехи на сухой сковороде 3–5 минут, порубить ножом и добавить в тесто.

      5. Смазать форму сливочным маслом, влить тесто и выложить сверху разрезанный вдоль оставшийся банан.

      6. Разогреть духовку до 180 °C и выпекать хлеб 50–60 минут до сухой зубочистки.

      7. Оставить хлеб в форме 15–20 минут, затем посыпать остывший кекс сахарной пудрой.
